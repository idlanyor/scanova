
name: Build APK & Publish Scanova Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag versi rilis (opsional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Scanova APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Environment
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Debug keystore
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Release keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode \
              > my-upload-key.jks

            echo "STORE_PASSWORD=$STORE_PASSWORD_SECRET" \
              >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" \
              >> "$GITHUB_ENV"
          else
            echo "::warning::Using temporary release signing key"

            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass android \
              -alias upload \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Scanova,OU=Mobile,O=Scanova,L=Jakarta,ST=DKI,C=ID"

            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" \
            >> "$GITHUB_ENV"

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest \
            --no-daemon --stacktrace

      - name: Build Debug APK, Release APK & AAB
        run: |
          ./gradlew \
            assembleDebug \
            assembleRelease \
            bundleRelease \
            --no-daemon \
            --stacktrace

      - name: Prepare Distribution Files
        run: |
          mkdir -p dist

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            dist/Scanova-debug.apk

          cp \
            app/build/outputs/apk/release/app-release.apk \
            dist/Scanova-release.apk

          cp \
            app/build/outputs/bundle/release/app-release.aab \
            dist/Scanova-release.aab

          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Scanova-Builds
          path: |
            dist/Scanova-debug.apk
            dist/Scanova-release.apk
            dist/Scanova-release.aab
          retention-days: 30

      - name: Determine Release Tag
        id: release_meta
        env:
          CUSTOM_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$CUSTOM_TAG" ]]; then
            TAG_NAME="$CUSTOM_TAG"
          else
            TAG_NAME="v1.0.${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Invalid release tag"
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish Scanova GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: Scanova ${{ steps.release_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true

          body: |
            ## Scanova — QR & Barcode Scanner

            ### Download APK

            - **Scanova-release.apk**
              Versi rilis untuk penggunaan sehari-hari.

            - **Scanova-debug.apk**
              Versi debug untuk pengujian.

            - **Scanova-release.aab**
              Android App Bundle untuk Google Play Store.

            ### Fitur Utama

            - QR Code & Barcode Scanner menggunakan CameraX dan ML Kit.
            - Multi-code scanning dalam satu frame.
            - Continuous batch scanning.
            - Scan QR dan barcode dari galeri.
            - Smart actions untuk URL, Wi-Fi, dan kontak.
            - Riwayat pemindaian offline menggunakan Room.
            - Export riwayat ke CSV.
            - QR Code Generator.
            - Dukungan Android 8.0 ke atas.

            ### Build Information

            - Commit: `${{ github.sha }}`
            - Branch/Tag: `${{ github.ref_name }}`

          files: |
            dist/Scanova-release.apk
            dist/Scanova-debug.apk
            dist/Scanova-release.aab

        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
